<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom py-3">
    <div class="container">
      <a class="navbar-brand fw-bold fs-3" href="index.html">HANI</a>
      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>

  <section class="container py-5">
    <h1 class="fw-bold text-center mb-4">Contact Us</h1>
    <div class="row justify-content-center">
      <div class="col-md-6">
        <form>
          <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input type="text" class="form-control" id="name" placeholder="Enter your name">
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" placeholder="Enter your email">
          </div>
          <div class="mb-3">
            <label for="message" class="form-label">Message</label>
            <textarea class="form-control" id="message" rows="4" placeholder="Your message here..."></textarea>
          </div>
          <button type="submit" class="btn btn-dark w-100">Send Message</button>
        </form>
        <div class="text-center mt-4">
          <p>Email: <strong>Hanicustomersupport@gmail.com</strong></p>
          <p>Phone: <strong>+63 912 345 6789</strong></p>
          <p>Follow us: <strong>@HaniClothing</strong></p>
        </div>
      </div>
    </div>
